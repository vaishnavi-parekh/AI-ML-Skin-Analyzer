<!DOCTYPE html><html lang=en data-theme=light><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>My profile · Glowra</title><link rel=stylesheet href=css/common.css><link rel=stylesheet href=css/profile.css></head><body><header id=nav></header><main>
<h1>My profile</h1>
<div class="pg">
<form id="fd" class="panel"><h2>Personal details</h2><label>Full name<input id="n" required></label><label>Email<input id="e" type="email" required></label><label>Phone number<input id="ph" pattern="[0-9]{10}" title="10-digit number" placeholder="10-digit mobile number"></label><p class="err" id="e1"></p><p><button class="btn">Save details</button></p></form>
<form id="fp" class="panel"><h2>Change password</h2><label>Current password<input id="cp" type="password" required autocomplete="current-password"></label><label>New password<input id="np" type="password" minlength="6" required autocomplete="new-password"></label><label>Confirm new password<input id="rp" type="password" minlength="6" required autocomplete="new-password"></label><p class="err" id="e2"></p><p><button class="btn">Update password</button></p></form>
</div>
<h2>Saved addresses</h2><div class="grid" id="al"></div>
<form id="fa" class="panel adf"><h2 id="at">Add a new address</h2><div class="g2"><label>Label<select id="lb"><option>Home</option><option>Work</option><option>Other</option></select></label><label>Full name<input id="an" required></label></div><div class="g2"><label>Phone<input id="ap" required pattern="[0-9]{10}" title="10-digit number"></label><label>PIN code<input id="az" required pattern="[0-9]{6}" title="6-digit PIN"></label></div><label>Address<textarea id="aa" rows="2" required></textarea></label><label>City<input id="ac" required></label><p><button class="btn">Save address</button> <button type="button" class="btn ghost" id="cx" hidden>Cancel</button></p></form>
</main><footer id=foot></footer><script src=js/data.js></script><script src=js/common.js></script><script src=js/profile.js></script></body></html>
