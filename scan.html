<!DOCTYPE html><html lang=en data-theme=light><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>AI Face Scan · Glowra</title><link rel=stylesheet href=css/common.css><link rel=stylesheet href=css/scan.css></head><body><header id=nav></header><main>
<h1>Your face, read in seconds</h1><p class="mut" style="max-width:56ch;margin:10px 0 20px">Photos stay on your device. Results are estimates from color analysis, not a medical diagnosis. Use soft, even light facing a window.</p>
<div class="tabs"><button class="chip on" data-t="cam">Camera</button><button class="chip" data-t="up">Upload photo</button><button class="chip" data-t="quiz">Quick quiz</button></div>
<div id="pcam"><div class="stage"><video id="v" autoplay playsinline muted></video><div class="ring"></div></div><button id="start" class="btn">Start camera</button> <button id="snap" class="btn rose" hidden>Scan my face</button></div>
<div id="pup" hidden><label>Choose a clear, front-facing photo<input type="file" id="f" accept="image/*"></label></div>
<form id="pq" hidden class="panel"><label>Skin type<select id="qs"><option>dry</option><option>normal</option><option>combination</option><option>oily</option></select></label><label>Skin tone<select id="qt"><option>fair</option><option>light</option><option>medium</option><option>tan</option><option>deep</option></select></label><label>Undertone<select id="qu"><option>warm</option><option>cool</option><option>neutral</option></select></label><label>Main concern<select id="qc"><option value="">None</option><option value="dryness">Dryness</option><option value="oil">Oiliness</option><option value="redness">Redness</option><option value="darkcircles">Dark circles</option></select></label><p><button class="btn">Get my picks</button></p></form>
<canvas id="c" hidden></canvas><p id="st" class="mut"></p><section id="res"></section>
</main><footer id=foot></footer><script src=js/data.js></script><script src=js/common.js></script><script src=js/scan.js></script></body></html>
